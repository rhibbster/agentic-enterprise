<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salesforce — The Agentic Enterprise is All Ways On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --sf-blue: #0176d3;
    --sky: #1ab9ff;
    --hero-deep: #0a1e8c;
    --hero-mid: #0b34c8;
    --track-ink: #003264;
    --glow: #5fd3ff;
    --demo-green: #2e844a;
    --nav-bg: #ffffff;
    --nav-ink: #032d60;
    --page-bg: #ffffff;
    --page-ink: #032d60;
    --muted: #444f63;
    --label: #0176d3;
    --font: "Urbanist", "Avant Garde for Salesforce", "Avenir Next", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --nav-bg: #0b1530;
      --nav-ink: #e8eefc;
      --page-bg: #07102a;
      --page-ink: #e8eefc;
      --muted: #b7c3de;
      --label: #6cc4ff;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--page-bg); color: var(--page-ink); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }

  /* ---------- Nav ---------- */
  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 28px;
    height: 64px; padding: 0 28px;
    background: var(--nav-bg); color: var(--nav-ink);
    box-shadow: 0 1px 0 rgba(3,45,96,.12);
  }
  .nav__logo { display: flex; width: 56px; }
  .nav__links { display: flex; gap: 22px; list-style: none; font-weight: 600; font-size: 15px; }
  .nav__links a { text-decoration: none; padding: 6px 0; }
  .nav__links a:hover { color: var(--sf-blue); }
  .nav__right { margin-left: auto; display: flex; align-items: center; gap: 22px; font-weight: 600; font-size: 15px; }
  .nav__login { display: flex; align-items: center; gap: 6px; text-decoration: none; }
  .btn-demo {
    background: var(--demo-green); color: #fff; text-decoration: none;
    padding: 10px 18px; border-radius: 4px; font-weight: 700;
  }
  .btn-demo:hover { background: #22683a; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 6px; }
  @media (max-width: 880px) { .nav__links { display: none; } .nav { gap: 16px; padding: 0 16px; } }

  /* ---------- Marquee ---------- */
  .marquee {
    --w: clamp(290px, 44vw, 560px);
    --h: calc(var(--w) * 0.4);
    --pad: calc(var(--h) * 0.085);
    --knob: calc(var(--h) - var(--pad) * 2);
    position: relative; overflow: hidden;
    min-height: calc(100vh - 64px); min-height: calc(100svh - 64px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(36px, 7vh, 80px);
    padding: clamp(40px, 8vh, 96px) 20px clamp(120px, 20vh, 220px);
    background:
      radial-gradient(60% 45% at 50% 72%, rgba(40,110,255,.75), transparent 70%),
      radial-gradient(120% 90% at 50% 0%, var(--hero-mid), var(--hero-deep) 75%);
    color: #fff;
    isolation: isolate;
  }
  @media (pointer: fine) { .marquee, .marquee * { cursor: none; } }

  .marquee h1 {
    position: relative; z-index: 3;
    text-align: center; font-weight: 800; line-height: .98; letter-spacing: -0.02em;
    font-size: clamp(36px, 8.4vw, 116px);
    text-wrap: balance;
    text-shadow: 0 4px 30px rgba(0,20,90,.35);
  }
  .marquee h1 span { display: block; }
  .marquee h1 .h1-accent { color: var(--sky); }
  .h1-last { position: relative; display: inline-block !important; }
  .sparkle { position: absolute; right: -0.62em; top: -0.12em; width: .62em; height: .62em; }

  /* Toggle */
  .stage { position: relative; z-index: 2; width: var(--w); height: var(--h); }
  .toggle {
    position: absolute; inset: 0; border: 0; background: none; padding: 0; color: inherit;
    border-radius: 999px;
  }
  .toggle__rim {
    position: absolute; inset: calc(var(--pad) * -0.55);
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(160,225,255,.35), rgba(80,150,255,.15));
    border: 2px solid rgba(150,225,255,.85);
    box-shadow: 0 0 22px 4px rgba(95,211,255,.65), inset 0 0 18px rgba(95,211,255,.5);
  }
  .toggle__track {
    position: absolute; inset: 0; border-radius: 999px; overflow: hidden;
    background: linear-gradient(180deg, #002c59 0%, #003773 100%);
    border: 2px solid rgba(140,215,255,.9);
    box-shadow: inset 0 6px 22px rgba(0,10,40,.7), 0 0 14px rgba(95,211,255,.6);
  }
  .person {
    position: absolute; bottom: 0; left: calc(var(--h) * 0.38);
    height: 92%; width: auto;
    opacity: 0; transform: translateY(35%) scale(.92); transform-origin: 50% 100%;
    transition: opacity .45s ease, transform .7s cubic-bezier(.2,.9,.3,1.1);
    pointer-events: none; user-select: none;
  }
  .toggle[aria-checked="true"] .person { opacity: 1; transform: none; transition-delay: .22s; }

  .knob {
    position: absolute; top: var(--pad); left: var(--pad);
    width: var(--knob); height: var(--knob); border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, #ffffff 0%, #e4ecff 38%, #b9cbff 100%);
    border: 2px solid rgba(160,230,255,.95);
    box-shadow: 0 0 0 4px rgba(95,211,255,.25), 0 0 26px 6px rgba(95,211,255,.75), inset 0 -8px 18px rgba(70,110,220,.25);
    display: grid; place-items: center;
    transition: transform .75s cubic-bezier(.65,0,.2,1.15);
    z-index: 2;
  }
  .toggle[aria-checked="true"] .knob { transform: translateX(calc(var(--w) - var(--knob) - var(--pad) * 2)); }
  .toggle:active .knob { scale: .97; }
  .knob svg { width: 78%; height: auto; filter: drop-shadow(0 0 6px rgba(95,211,255,.9)); }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Floating icons */
  .burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 4; pointer-events: none; }
  .fly { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; }
  .fly img {
    display: block; width: var(--s); height: auto;
    translate: -50% -50%;
    filter: drop-shadow(0 10px 18px rgba(0,10,60,.45));
  }
  .fly.floating img { animation: bob var(--d) ease-in-out var(--dl) infinite alternate; }
  @keyframes bob {
    from { transform: translateY(-7px) rotate(calc(var(--r) * -1)); }
    to   { transform: translateY(7px)  rotate(var(--r)); }
  }

  /* Custom glass cursor */
  .cursor {
    position: fixed; left: 0; top: 0; z-index: 100; width: 66px; height: 86px;
    pointer-events: none; opacity: 0; transition: opacity .2s ease;
    filter: drop-shadow(0 0 10px rgba(95,211,255,.8)) drop-shadow(0 8px 14px rgba(0,10,60,.35));
  }
  .cursor.is-visible { opacity: 1; }
  .cursor__inner { position: absolute; inset: 0; transform-origin: 6px 4px; transform: scale(1.35); transition: transform .15s ease; }
  .cursor.is-down .cursor__inner { transform: scale(1.18); }
  .cursor__glass {
    position: absolute; inset: 0;
    clip-path: path("M6 4 L6 66 L21 52 L32 78 L45 72 L34 47 L55 46 Z");
    background: linear-gradient(160deg, rgba(200,235,255,.8), rgba(70,160,255,.55) 55%, rgba(30,110,240,.65));
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .cursor svg { position: absolute; inset: 0; }
  @media (pointer: coarse) { .cursor { display: none; } }

  /* ---------- Products ---------- */
  .products { padding: clamp(64px, 10vw, 112px) 24px; max-width: 1240px; margin: 0 auto; }
  .products h2 { font-size: clamp(30px, 4vw, 46px); font-weight: 800; letter-spacing: -0.015em; text-align: center; max-width: 22ch; margin: 0 auto 12px; }
  .products > p { text-align: center; color: var(--muted); font-size: 18px; max-width: 56ch; margin: 0 auto 56px; line-height: 1.5; }
  .grid { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 40px 16px; }
  .grid a { display: flex; flex-direction: column; align-items: center; gap: 14px; text-decoration: none; color: var(--label); font-weight: 700; font-size: 16px; text-align: center; padding: 8px; }
  .grid img { width: 84px; height: 84px; object-fit: contain; transition: transform .25s ease; }
  .grid a:hover img { transform: translateY(-4px); }

  @media (prefers-reduced-motion: reduce) {
    .knob, .person { transition-duration: .01s !important; }
    .fly.floating img { animation: none; }
  }
</style>
</head>

/* Final resting spots measured from the toggle's centre:
   dx in multiples of the track width, dy in multiples of the track height.
   s = relative size, r = wobble angle while floating. */
const SPOTS = {
  agentforce:    { dx: -0.92, dy: -0.45, s: 1.25, r: 5 },
  service:       { dx: -0.60, dy: -0.66, s: 0.80, r: 6 },
  smallbusiness: { dx: -1.16, dy: -1.00, s: 0.75, r: 4 },
  tableau:       { dx: -1.02, dy:  0.30, s: 0.90, r: -3 },
  industries:    { dx: -0.84, dy:  0.98, s: 0.85, r: -4 },
  marketing:     { dx: -0.52, dy:  0.98, s: 0.95, r: -5 },
  platform:      { dx: -0.20, dy:  1.10, s: 0.80, r: 6 },
  heroku:        { dx:  0.06, dy:  1.32, s: 0.70, r: 5 },
  data:          { dx:  0.32, dy:  1.04, s: 0.80, r: -4 },
  mulesoft:      { dx:  0.62, dy:  0.92, s: 0.90, r: -6 },
  partners:      { dx:  1.10, dy:  0.95, s: 0.85, r: 3 },
  commerce:      { dx:  0.98, dy:  0.12, s: 1.00, r: 4 },
  sales:         { dx:  0.90, dy: -0.62, s: 1.05, r: -4 },
  slack:         { dx:  0.60, dy: -0.70, s: 0.80, r: 5 },
  success:       { dx:  1.16, dy: -1.02, s: 0.80, r: -5 }
};

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const toggle = document.getElementById('toggle');
const stage  = document.getElementById('stage');
const burst  = document.getElementById('burst');
const hero   = document.getElementById('marquee');

/* Build product grid */
const grid = document.getElementById('grid');
ICONS.forEach(i => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#"><img src="${i.src}" alt=""><span>${i.label}</span></a>`;
  grid.appendChild(li);
});

/* Build flying icons */
const flyers = ICONS.map((icon, idx) => {
  const el = document.createElement('div');
  el.className = 'fly';
  const img = document.createElement('img');
  img.src = icon.src; img.alt = '';
  el.appendChild(img);
  const spot = SPOTS[icon.key];
  img.style.setProperty('--r', spot.r + 'deg');
  img.style.setProperty('--d', (2.6 + (idx % 5) * 0.45) + 's');
  img.style.setProperty('--dl', (-(idx * 0.37) % 2) + 's');
  burst.appendChild(el);
  return { el, img, spot, anim: null };
});

function layout() {
  const W = stage.offsetWidth, H = stage.offsetHeight;
  const heroW = hero.clientWidth;
  // Squeeze horizontally on narrow screens so icons stay in frame
  const maxDx = Math.max(...flyers.map(f => Math.abs(f.spot.dx)));
  const room = heroW / 2 - W * 0.08 - 10;
  const xs = Math.min(1, room / (maxDx * W));
  flyers.forEach(f => {
    // On narrow screens, shrink icons a little and spread them vertically instead
    const size = Math.max(34, W * 0.15 * f.spot.s * (0.65 + 0.35 * xs));
    f.img.style.setProperty('--s', size + 'px');
    f.x = f.spot.dx * W * xs;
    f.y = f.spot.dy * H * (f.spot.dy > 0 ? 1 + (1 - xs) * 1.6 : 0.6 + 0.4 * xs);
  });
  return W;
}

function setOpen(open) {
  toggle.setAttribute('aria-checked', String(open));
  const W = layout();
  // Icons emerge from where the person appears (left half of the track)
  const ox = -W * 0.22, oy = W * 0.02;

  flyers.forEach((f, i) => {
    if (f.anim) f.anim.cancel();
    f.el.classList.remove('floating');
    const home = `translate(${ox}px, ${oy}px) scale(.15)`;
    const away = `translate(${f.x}px, ${f.y}px) scale(1)`;

    if (reduceMotion) {
      f.anim = f.el.animate(
        [{ transform: away, opacity: open ? 0 : 1 }, { transform: away, opacity: open ? 1 : 0 }],
        { duration: 250, fill: 'forwards' });
      return;
    }
    if (open) {
      // Drift: long, soft ease-out with no overshoot, wide stagger, slow fade-in.
      // The bob starts right away so each icon is already bobbing as it drifts.
      f.el.classList.add('floating');
      f.anim = f.el.animate([
        { transform: `translate(${ox}px, ${oy}px) scale(.45)`, opacity: 0 },
        { opacity: 1, offset: 0.4 },
        { transform: away, opacity: 1 }
      ], { duration: 3200 + (i % 4) * 350, delay: 600 + i * 160, easing: 'cubic-bezier(.22,.6,.25,1)', fill: 'forwards' });
    } else {
      f.anim = f.el.animate([
        { transform: away, opacity: 1 },
        { opacity: 1, offset: 0.7 },
        { transform: home, opacity: 0 }
      ], { duration: 520, delay: (flyers.length - i) * 18, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' });
    }
  });
}

toggle.addEventListener('click', () => setOpen(toggle.getAttribute('aria-checked') !== 'true'));

/* Keep icons in place on resize while open */
let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (toggle.getAttribute('aria-checked') !== 'true') { layout(); return; }
    layout();
    flyers.forEach(f => {
      if (f.anim) f.anim.cancel();
      f.anim = f.el.animate([{ transform: `translate(${f.x}px, ${f.y}px)`, opacity: 1 }], { duration: 1, fill: 'forwards' });
      f.el.classList.add('floating');
    });
  }, 120);
});
layout();

/* Glass cursor */
const cursor = document.getElementById('cursor');
if (matchMedia('(pointer: fine)').matches) {
  let x = 0, y = 0, cx = 0, cy = 0, raf;
  const tick = () => {
    cx += (x - cx) * 0.45; cy += (y - cy) * 0.45;
    cursor.style.transform = `translate(${cx - 6}px, ${cy - 4}px)`;
    raf = (Math.abs(x - cx) + Math.abs(y - cy) > 0.3) ? requestAnimationFrame(tick) : null;
  };
  hero.addEventListener('pointermove', e => {
    x = e.clientX; y = e.clientY;
    if (!cursor.classList.contains('is-visible')) { cx = x; cy = y; }
    cursor.classList.add('is-visible');
    if (!raf) raf = requestAnimationFrame(tick);
  });
  hero.addEventListener('pointerleave', () => cursor.classList.remove('is-visible'));
  hero.addEventListener('pointerdown', () => cursor.classList.add('is-down'));
  addEventListener('pointerup', () => cursor.classList.remove('is-down'));
}
</script>
